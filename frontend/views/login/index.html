<div class="vh-100 vw-100 d-flex flex-column justify-content-center align-items-center bg-black neblina px-3">    
    
    <img 
        class="position-absolute"
        style="top: 0%; right: 5%; opacity: 0.4; " 
        src="./frontend/assets/img/icon-512.webp"
    >

    <div id="splash-screen" class="splash-container">
        <div id="splash-wrapper" class="splash-wrapper">
            
            <!-- Bloque Izquierdo: Logo + Título -->
            <div class="splash-brand-box">
                <div class="logo-glow-container mb-3">
                    <img src="./frontend/assets/img/icon-512.webp" alt="Logo SIRA-FP" class="splash-logo">
                </div>
                <h1 id="splash-welcome" class="welcome-title">Bienvenido a <br><span class="text-info">SIRA-FP</span></h1>
            </div>

            <!-- Línea divisora vertical -->
            <div class="splash-divider"></div>

            <!-- Bloque Derecho: Acróstico (Siempre presente en el DOM, animado por opacidad y desplazamiento) -->
            <div id="splash-acrostic" class="acrostic-box">
                <div class="acrostic-row"><span class="letra">S</span> <span class="texto">istema</span></div>
                <div class="acrostic-row"><span class="letra">I</span> <span class="texto">nformación</span></div>
                <div class="acrostic-row"><span class="letra">R</span> <span class="texto">egistro</span></div>
                <div class="acrostic-row"><span class="letra">A</span> <span class="texto">lumnos</span></div>
                <div class="acrostic-row"><span class="letra">F</span> <span class="texto">ernando</span></div>
                <div class="acrostic-row"><span class="letra">P</span> <span class="texto">eñalver</span></div>
            </div>

        </div>
    </div>


    <form id="formulario-login" class="z-2 w-100" style="max-width: 380px;">
        <!-- Contenedor con efecto vidrio, borde tenue y sombra pulida -->
        <div class="text-white p-4 p-sm-5 rounded-4 d-flex flex-column gap-3 text-uppercase bg-dark bg-opacity-75 border border-secondary border-opacity-25 shadow-lg backdrop-blur flotar">
            
            <h2 id="title-form-login" class="fs-4 fw-bolder text-white font-monospace mb-2 text-center tracking-tight border-bottom border-secondary border-opacity-25 pb-3">
                Iniciar Session
            </h2>

            <!-- USUARIO -->
            <div class="d-flex flex-column gap-2 fw-medium">
                <label class="fs-7 text-white-50">Usuario:</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary border-opacity-25 text-white-50">
                        <i class="bi bi-person-fill"></i>
                    </span>
                    <input 
                        class="form-control bg-black border-secondary border-opacity-25 text-white shadow-none py-2 custom-placeholder-white" 
                        type="text" 
                        name="nombre" 
                        placeholder="User"
                        spellcheck="false" 
                        autocomplete="off" 
                        required 
                    >
                </div>
            </div>

            <!-- CONTRASEÑA -->
            <div class="d-flex flex-column gap-2 fw-medium">
                <label class="fs-7 text-white-50">Contraseña:</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary border-opacity-25 text-white-50">
                        <i class="bi bi-key-fill"></i>
                    </span>
                    <input 
                        class="form-control bg-black border-secondary border-opacity-25 text-white shadow-none py-2 custom-placeholder-white border-end-0" 
                        type="password" 
                        id="input-pass"
                        name="pass" 
                        placeholder="*****"
                        autocomplete="off" 
                        required 
                    >
                    <button 
                        class="input-group-text bg-black border-secondary border-opacity-25 text-white-50 btn-toggle-pass" 
                        type="button" 
                        id="btn-ver-pass"
                        tabindex="-1"
                    >
                        <i class="bi bi-eye-slash" id="icono-pass"></i>
                    </button>
                </div>
            </div>

            <!-- CONFIRMAR CONTRASEÑA (INPUT EXTRA OCULTO) -->
            <div id="contenedor-confirmar-pass" class="d-none flex-column gap-2 fw-medium">
                <label class="fs-7 text-white-50">Confirmar Contraseña:</label>
                <div class="input-group">
                    <span class="input-group-text bg-black border-secondary border-opacity-25 text-white-50">
                        <i class="bi bi-check2-circle"></i>
                    </span>
                    <input 
                        class="form-control bg-black border-secondary border-opacity-25 text-white shadow-none py-2 custom-placeholder-white border-end-0" 
                        type="password" 
                        id="input-confirmar-pass"
                        name="confirmar_pass" 
                        placeholder="*****"
                        autocomplete="off" 
                        disabled="true"
                    >
                    <button 
                        class="input-group-text bg-black border-secondary border-opacity-25 text-white-50 btn-toggle-pass" 
                        type="button" 
                        id="btn-ver-confirmar-pass"
                        tabindex="-1"
                    >
                        <i class="bi bi-eye-slash" id="icono-confirmar-pass"></i>
                    </button>
                </div>
            </div>

            <!-- BOTÓN INGRESAR -->
            <button 
                class="mt-3 btn btn-light fw-bolder py-2 shadow-sm text-uppercase" 
                style="transition: all .2s ease-in-out;"
                type="button" 
                id="btn-ingresar" 
            >
                Ingresar
            </button>
            
        </div>

    </form>
</div>
