<div  
    class="vh-100 vw-100 d-flex flex-column justify-content-center align-items-center bg-black neblina"  
>   
    
    <form id="formulario-login" class="z-2">
        <div class="text-white p-5 rounded-4 d-flex flex-column gap-3 text-uppercase bg-dark flotar" 
        >
            <h2 class="fs-3 fw-bolder text-white font-monospace mb-3">Ingreso al Sistema</h2>

            <div class="d-flex flex-column gap-2 fw-medium">
                <label>Usuario:</label>
                <input 
                 class="form-control" 
                 type="text" 
                 name="nombre" 
                 placeholder="User"
                 spellcheck="false" 
                 autocomplete="off" 
                 required 
                >
            </div>

            <div class="d-flex flex-column gap-2 fw-medium">
                <label>Contraseña:</label>
                <input 
                 class="form-control" 
                 type="password" 
                 name="pass" 
                 placeholder="*****"
                 autocomplete="off" 
                 required 
                >
            </div>

            <button 
             class="mt-4 btn btn-light fw-bolder" 
             style="transition: all .2s ease-in-out;"
             type="button" 
             id="btn-ingresar" 
            >
                Ingresar
            </button>
            
        </div>

    </form>
</div>
