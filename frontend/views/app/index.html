<div class="vh-100 vw-100 d-flex bg-dark-subtle p-2 gap-2 overflow-hidden">
    
    <!-- Sidebar / Menú Lateral -->
    <nav 
     class="h-100 p-3 rounded-4 d-flex flex-column gap-3 flex-shrink-0 bg-dark text-white shadow-sm" 
     style="width: 220px;"
    > 
        <!-- Header / Título -->
        <div class="d-flex align-items-center gap-2 px-2 py-1 mb-2 border-bottom border-secondary border-opacity-25">
            <i class="bi bi-mortarboard-fill text-warning fs-5"></i>
            <h1 class="text-white fs-6 fw-bold m-0 tracking-wide text-truncate">
                Sistema Peñalver
            </h1>
        </div>

        <!-- Lista de Navegación -->
        <div class="d-flex flex-column gap-1">
            
            <button 
             type="button" 
             id="btn-dashboard" 
             class="btn btn-dark text-start border-0 fw-medium fs-6 py-2 px-3 rounded-3 active-style"
            >
                <i class="bi bi-grid-1x2-fill me-2 opacity-75"></i>
                Dashboard
            </button>
            
            <button 
             type="button" 
             id="btn-registro" 
             class="btn btn-dark text-start border-0 fw-medium fs-6 py-2 px-3 rounded-3"
            >
                <i class="bi bi-journal-plus me-2 opacity-75"></i>
                Registro
            </button>

            <button 
             type="button" 
             id="btn-reporte" 
             class="btn btn-dark text-start border-0 fw-medium fs-6 py-2 px-3 rounded-3"
            >
                <i class="bi bi-file-earmark-bar-graph me-2 opacity-75"></i>
                Reportes
            </button>

            <button 
             type="button" 
             id="btn-usuarios" 
             class="btn btn-outline-warning text-start border-0 fw-medium fs-6 py-2 px-3 rounded-3 d-none"
            >
                <i class="bi bi-people-fill me-2 opacity-75"></i>
                Gestionar Usuarios
            </button>

        </div>

        <!-- Footer / Botón Salir -->
        <div class="mt-auto pt-2 border-top border-secondary border-opacity-25">
            <button 
             type="button"
             id="btn-salir" 
             class="btn btn-outline-danger w-100 fw-medium rounded-3 py-2 fs-6 border-0 text-start px-3"
            >
                <i class="bi bi-box-arrow-left me-2"></i>
                Cerrar Sesión
            </button>
        </div>

    </nav>

    <!-- Main encargado de renderizar las vistas -->
    <main 
     id="root-app" 
     class="flex-grow-1 h-100 d-flex flex-column overflow-auto rounded-4 bg-body border border-secondary-subtle shadow-sm p-4"
    >
        <!-- Aquí tu JavaScript inyectará las vistas -->
    </main>

</div>
