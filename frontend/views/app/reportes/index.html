<div class="container py-4">
    <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h3 class="fw-bold text-dark m-0">Reporte de Alumnos Inscritos</h3>
                <p class="text-secondary small m-0">Listado general del sistema académico</p>
            </div>
            <span class="badge bg-primary rounded-pill px-3 py-2 fs-6" id="total-inscritos">0 Alumnos</span>
        </div>
        
        <div class="table-responsive">
            <table class="table table-hover align-middle m-0">
                <thead class="table-dark">
                    <tr>
                        <th scope="col" class="py-3 ps-4">Cédula / Escolar</th>
                        <th scope="col" class="py-3">Estudiante</th>
                        <th scope="col" class="py-3">Fecha de Inscripción</th>
                        <th scope="col" class="py-3 text-center pe-4">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-inscritos-body">
                    <tr>
                        <td colspan="4" class="text-center py-4 text-secondary">
                            <div class="spinner-border spinner-border-sm me-2 text-primary" role="status"></div>
                            Cargando lista de inscritos...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
