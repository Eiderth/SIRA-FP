<!-- INTERFAZ DE ERROR -->
<div id="status-error" class="d-flex align-items-center justify-content-center h-100">
    <div class="card border-0 shadow-lg px-5 py-4 text-center bg-white rounded-4" style="max-width: 600px; width: 100%;">
        
        <div class="mb-2 d-flex justify-content-center">
            <div class="d-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle" style="width: 100px; height: 100px;">
                ⚠            
            </div>
        </div>

        <h2 class="fw-extrabold text-dark tracking-tight mb-2 fs-1">Algo salió mal</h2>
        <p class="text-muted fs-5 mb-2">No se pudo completar el proceso de inscripción en el sistema.</p> 

        <div class="bg-danger bg-opacity-5 rounded-3 p-4 mb-2 border border-danger border-opacity-10 text-start">
            <span class="text-uppercase fw-bold text-danger-emphasis fs-7 tracking-wider d-block mb-1">Detalle técnico del error:</span>
            <p id="mensaje-tecnico" class="text-light fw-semibold fs-5 m-0 font-monospace" style="word-break: break-word;">
                </p> 
        </div>

        <div class="d-grid gap-2 d-md-flex justify-content-md-center mt-2">
            <button type="button" id="btn-volver" class="btn btn-outline-secondary btn-lg px-4 py-3 fw-bold rounded-3 me-md-2">
                Volver
            </button>
        </div>
        
    </div>
</div>
