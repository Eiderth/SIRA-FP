<section class="container py-4">
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md">
            <h2 class="h4 mb-1 fw-bold text-dark">Gestión de Personal</h2>
            <p class="text-secondary small mb-0">Crea, edita o elimina los accesos de los usuarios al sistema escolar.</p>
        </div>
    </div>

    <div class="row g-4">
        
        <article class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-dark text-white py-3 d-flex align-items-center justify-content-between">
                    <h3 class="m-0 fs-5 fw-semibold">Personal en el Sistema</h3>
                    <span class="badge bg-secondary px-2.5 py-1.5 rounded-pill small" id="contador-usuarios">--</span>
                </div>
                <div class="table-responsive card-body p-0">
                    <table class="table table-hover align-middle m-0">
                        <thead class="table-light text-secondary small text-uppercase font-monospace">
                            <tr>
                                <th class="py-3 ps-4" style="width: 10%">ID</th>
                                <th class="py-3" style="width: 40%">Nombre</th>
                                <th class="py-3" style="width: 25%">Rol / Permisos</th>
                                <th class="py-3 pe-4 text-end" style="width: 25%">estado</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-body">
                            <tr>
                                <td colspan="4" class="text-center py-5 text-secondary">
                                    <span class="spinner-border spinner-border-sm me-2 text-primary" role="status" aria-hidden="true"></span>
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </article>

        <article class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-header bg-dark text-white py-3">
                    <h3 class="m-0 fs-5 fw-semibold" id="form-titulo">Registrar Usuario</h3>
                </div>
                <form id="formulario-crear-usuario" class="card-body p-4 d-flex flex-column justify-content-between">
                    <div>
                        <input type="hidden" name="id" id="input-usuario-id">

                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary">Nombre de usuario</label>
                            <input type="text" name="nombre" id="input-usuario-nombre" class="form-control py-2" placeholder="ej: mara_perez" required autocomplete="off">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold small text-secondary" id="label-pass">Contraseña</label>
                            <input type="password" name="pass" id="input-usuario-pass" class="form-control py-2" placeholder="••••••" required autocomplete="off">
                            <div class="form-text small text-muted d-none" id="help-pass">Deja en blanco si no deseas cambiarla.</div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small text-secondary">Rol del usuario</label>
                            <select name="rol" id="input-usuario-rol" class="form-select py-2" required>
                                <option value="">Seleccione un rol...</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Secretaria">Secretaria</option>
                                <option value="Docente">Docente</option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <button type="button" id="btn-crear-usuario" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                            Guardar Usuario
                        </button>
                        <button type="button" id="btn-cancelar-edicion" class="btn btn-light w-100 py-2 fw-bold mt-2 d-none">
                            Cancelar Edición
                        </button>
                        <div id="mensaje-admin" class="mt-3"></div>
                    </div>
                </form>
            </div>
        </article>

    </div>
</section>
