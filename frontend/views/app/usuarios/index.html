<section class="container-fluid px-lg-4 py-3">
    <!-- Encabezado de Sección -->
    <div class="row align-items-center mb-3 g-2">
        <div class="col-12">
            <h2 class="h5 mb-1 fw-bold text-dark">Gestión de Personal</h2>
            <p class="text-secondary small mb-0">Crea, edita o elimina los accesos de los usuarios al sistema escolar.</p>
        </div>
    </div>

    <div class="row g-3 align-items-start">
        
        <!-- COLUMNA IZQUIERDA: Tabla de Usuarios con Barra de Filtros -->
        <article class="col-12 col-lg-8 col-xl-9">
            <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
                
                <!-- Card Header: Título + Contador + Filtros Integrados -->
                <div class="card-header bg-white py-3 px-3 border-bottom">
                    <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <h3 class="m-0 fs-6 fw-bold text-dark">Personal en el Sistema</h3>
                            <span class="badge bg-primary-subtle text-primary fw-bold px-2 py-1 rounded-pill small" id="contador-usuarios">0</span>
                        </div>
                    </div>

                    <!-- BARRA DE FILTROS -->
                    <form id="formulario-filtrar-usuarios" class="row g-2 align-items-center">
                        <!-- Buscador por Nombre o ID -->
                        <div class="col-12 col-md-4">
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0 text-secondary">
                                    <i class="bi bi-search"></i>
                                </span>
                                <input type="text" name="general" id="filtro-busqueda-general" class="form-control bg-light border-start-0 shadow-none" placeholder="Buscar por nombre o ID...">
                            </div>
                        </div>

                        <!-- Filtro por Rol -->
                        <div class="col-6 col-md-3">
                            <select id="filtro-rol" name="rol" class="form-select form-select-sm bg-light shadow-none">
                                <option value="">Todos los Roles</option>
                                <option value="Administrador">Administrador</option>
                                <option value="Secretaria">Secretaria</option>
                                <option value="Usuario">Usuario</option>
                            </select>
                        </div>

                        <!-- Filtro por Estado -->
                        <div class="col-6 col-md-3">
                            <select id="filtro-estado" name="estado" class="form-select form-select-sm bg-light shadow-none">
                                <option value="">Todos los Estados</option>
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>

                        <!-- Botón Buscar -->
                        <div class="col-12 col-md-2">
                            <button type="button" id="btn-filtrar-usuarios" class="btn btn-sm btn-primary w-100 fw-bold shadow-sm d-flex align-items-center justify-content-center gap-1">
                                <i class="bi bi-search fs-7"></i>
                                <span>Buscar</span>
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Contenedor con Scroll Interno -->
                <div class="table-responsive" style="max-height: 520px; overflow-y: auto;">
                    <table class="table table-hover align-middle m-0 text-nowrap">
                        <thead class="table-light text-secondary small text-uppercase font-monospace sticky-top">
                            <tr>
                                <th class="py-2.5 ps-3" style="width: 70px;">ID</th>
                                <th class="py-2.5">Nombre</th>
                                <th class="py-2.5" style="min-width: 140px;">Rol</th>
                                <th class="py-2.5" style="min-width: 120px;">Estado</th>
                                <th class="py-2.5 pe-3 text-end" style="width: 100px;">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-usuarios-body">
                            <tr>
                                <td colspan="5" class="text-center py-5 text-secondary">
                                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                    Cargando usuarios...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Card Footer: Botón de Restablecer / Limpiar Filtros -->
                <div class="card-footer bg-white py-2 px-3 border-top d-flex justify-content-between align-items-center">
                    <span class="text-muted small">Mostrando listado general o filtrado.</span>
                    <button type="button" id="btn-resetear-tabla" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
                        <i class="bi bi-arrow-counterclockwise fs-7"></i>
                        <span>Restablecer valores</span>
                    </button>
                </div>

            </div>
        </article>

        <!-- COLUMNA DERECHA: Formulario Sticky -->
        <article class="col-12 col-lg-4 col-xl-3 position-lg-sticky" style="top: 15px;">
            <div class="card border-0 shadow-sm rounded-3">
                <div class="card-header bg-white py-2.5 px-3 border-bottom">
                    <h3 class="m-0 fs-6 fw-bold text-dark">Registrar Usuario</h3>
                </div>
                
                <form id="formulario-crear-usuario" class="card-body p-3">
                    <div class="mb-2.5">
                        <label class="form-label fw-semibold small text-secondary mb-1">Nombre de usuario</label>
                        <input type="text" name="nombre" id="input-usuario" class="form-control form-control-sm py-2 shadow-none" placeholder="ej: mara_perez" required autocomplete="off">
                    </div>

                    <!-- Contraseña -->
                    <div class="mb-2.5">
                        <label class="form-label fw-semibold small text-secondary mb-1">Contraseña</label>
                        <div class="input-group input-group-sm">
                            <input type="password" name="pass" id="input-pass" class="form-control py-2 shadow-none" placeholder="••••••••" required autocomplete="off">
                            <button type="button" id="btn-ver-pass" class="btn btn-outline-secondary">
                                <i id="icono-pass" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="mb-2.5">
                        <label class="form-label fw-semibold small text-secondary mb-1">Confirmar Contraseña</label>
                        <div class="input-group input-group-sm">
                            <input type="password" name="confirmar_pass" id="input-confirmar-pass" class="form-control py-2 shadow-none" placeholder="••••••••" required autocomplete="off">
                            <button class="btn btn-outline-secondary" type="button" id="btn-ver-confirmar-pass">
                                <i id="icono-confirmar-pass" class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small text-secondary mb-1">Rol del usuario</label>
                        <select name="rol" id="input-usuario-rol" class="form-select form-select-sm py-2 shadow-none" required>
                            <option value="">Seleccione un rol...</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Secretaria">Secretaria</option>
                            <option value="Usuario">Usuario</option>
                        </select>
                    </div>

                    <button type="button" id="btn-crear-usuario" class="btn btn-primary w-100 py-2 fw-bold shadow-sm">
                        Guardar Usuario
                    </button>
                </form>
            </div>
        </article>

    </div>
</section>
