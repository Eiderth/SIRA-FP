    
<form id="formulario-representante-principal" class="mb-5 needs-validation" novalidate>
    <h5 class="fw-bold mb-4 text-dark fs-4">6. Información del Representante Principal</h5>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Nacionalidad *</label>
            <div class="btn-group w-100" role="group">
                <input type="radio" class="btn-check" name="nacionalidad" id="nac_v" value="V" checked autocomplete="off">
                <label class="btn btn-outline-secondary py-2" for="nac_v">V</label>
                <input type="radio" class="btn-check" name="nacionalidad" id="nac_e" value="E" autocomplete="off">
                <label class="btn btn-outline-secondary py-2" for="nac_e">E</label>
            </div>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Cédula *</label>
            <input type="text" name="cedula" class="form-control border-0 shadow-sm py-2" required autocomplete="off">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Parentesco *</label>
            <select name="parentesco" class="form-select border-0 shadow-sm py-2">
                <option value="Madre" selected>Madre</option>
                <option value="Padre">Padre</option>
                <option value="Tio">Tio</option>
                <option value="Tia">Tia</option>
                <option value="Abuelo">Abuelo</option>
                <option value="Abuela">Abuela</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Primer Nombre *</label>
            <input type="text" name="nombre_1" class="form-control border-0 shadow-sm py-2" required autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Segundo Nombre</label>
            <input type="text" name="nombre_2" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Primer Apellido *</label>
            <input type="text" name="apellido_1" class="form-control border-0 shadow-sm py-2" required autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Segundo Apellido</label>
            <input type="text" name="apellido_2" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>


        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Fecha de Nacimiento</label>
            <input type="date" name="fecha_nacimiento" class="form-control border-0 shadow-sm py-2" required autocomplete="off">
        </div>
        <div class="col-md-2">
            <label class="form-label fw-bold small text-secondary">Sexo</label>
            <select name="sexo" class="form-select border-0 shadow-sm py-2">
                <option value="F" selected>F</option>
                <option value="M">M</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Estado Civil</label>
            <select name="estado_civil" class="form-select border-0 shadow-sm py-2">
                <option value="Soltera/o" selected>Soltera/o</option>
                <option value="Casada/o">Casada/o</option>
                <option value="Divorciada/o">Divorciada/o</option>
                <option value="Viuda/o">Viuda/o</option>
            </select>
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold small text-secondary">Ingreso Mensual (REAL)</label>
            <input type="number" step="0.01" name="ingreso_mensual" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>

        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Teléfono Móvil</label>
            <input type="text" name="telefono_movil" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Teléfono Habitación</label>
            <input type="text" name="telefono_habitacion" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Correo Electrónico</label>
            <input type="email" name="correo_electronico" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>

        <!-- Información Laboral -->
        <div class="col-md-6">
            <label class="form-label fw-bold small text-secondary">Profesión / Oficio</label>
            <input type="text" name="profesion" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold small text-secondary">Empresa de Trabajo</label>
            <input type="text" name="empresa_trabajo" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Teléfono Empresa</label>
            <input type="text" name="telefono_empresa" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-8">
            <label class="form-label fw-bold small text-secondary">Dirección de la Empresa</label>
            <input type="text" name="direccion_empresa" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
    </div>
</form>

<hr class="my-5 opacity-10">

<form id="formulario-direccion-r-principal" class="mb-5 needs-validation" novalidate>
    <h5 class="fw-bold mb-4 text-dark fs-4">7. Dirección de Representante Principal</h5>
    <div class="row g-3">
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Estado *</label>
            <select id="select-estado" name="estado_id" class="form-select border-0 shadow-sm py-2">
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Municipio *</label>
            <select id="select-municipio" name="municipio_id" class="form-select border-0 shadow-sm py-2">
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Ciudad *</label>
            <select id="select-ciudad" name="ciudad_id" class="form-select border-0 shadow-sm py-2">
            </select>
        </div>
        
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Parroquia</label>
            <select id="select-parroquia" name="parroquia_id" class="form-select border-0 shadow-sm py-2">
            </select>
        </div>

        <!-- Detalles de Ubicación Específica -->
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Urbanización</label>
            <input type="text" name="urbanizacion" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Sector</label>
            <input type="text" name="sector" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Barrio</label>
            <input type="text" name="barrio" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Avenida</label>
            <input type="text" name="avenida" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>

        <div class="col-md-3">
            <label class="form-label fw-bold small text-secondary">Calle</label>
            <input type="text" name="calle" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-2">
            <label class="form-label fw-bold small text-secondary">Manzana</label>
            <input type="text" name="manzana" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-2">
            <label class="form-label fw-bold small text-secondary">Vereda</label>
            <input type="text" name="vereda" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>
        <div class="col-md-2">
            <label class="form-label fw-bold small text-secondary">N° vivienda</label>
            <input type="text" name="numero_vivienda" class="form-control border-0 shadow-sm py-2" autocomplete="off">
        </div>

        <!-- Condiciones de Vivienda -->
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Tipo de Vivienda *</label>
            <select name="tipo_vivienda" class="form-select border-0 shadow-sm py-2">
                <option value="Casa" selected>Casa</option>
                <option value="Edificio">Edificio</option>
                <option value="Apartamento">Apartamento</option>
                <option value="Quinta">Quinta</option>
                <option value="Rancho">Rancho</option>
                <option value="Otro">Otro</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Condición Vivienda *</label>
            <select name="condicion_vivienda" class="form-select border-0 shadow-sm py-2">
                <option value="Propia" selected>Propia</option>
                <option value="Alquilada">Alquilada</option>
                <option value="Pagándose">Pagándose</option>
                <option value="Prestada">Prestada</option>
                <option value="Invadida">Invadida</option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label fw-bold small text-secondary">Infraestructura *</label>
            <select name="infraestructura_vivienda" class="form-select border-0 shadow-sm py-2">
                <option value="Buena" selected>Buena</option>
                <option value="Regular">Regular</option>
                <option value="Deteriorada">Deteriorada</option>
            </select>
        </div>
    </div>
</form>
